<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>YouTube</title>

    <!-- WhatsApp 預覽專用標籤 -->
    <meta property="og:site_name" content="YouTube">
    <meta property="og:title" content="【突發】2026 遊戲大獎得主名單意外流出！官方緊急刪除影片">
    <meta property="og:description" content="YouTube · 觀看次數：45萬次 · 1小時前">
    
    <!-- 縮圖：這裡用了一張外觀像 YouTube 播放鍵的假縮圖 -->
    <meta property="og:image" content="https://imgur.com">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="video.other">

    <!-- 點開後自動跳轉到 Rickroll 影片 -->
    <meta http-equiv="refresh" content="0;url=https://youtube.com">
</head>
